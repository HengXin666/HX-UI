name: 功能需求
description: 描述问题与期望行为 (缺公共控件请用公共控件缺口模板)
labels: [enhancement]
body:
    - type: textarea
      id: problem
      attributes:
          label: 问题与受影响的使用者
      validations:
          required: true
    - type: textarea
      id: behavior
      attributes:
          label: 期望行为与验收示例
      validations:
          required: true
    - type: textarea
      id: boundaries
      attributes:
          label: 范围, 约束与备选方案
          description: 是否影响视觉 token, 现有 API 或上游 open-vetta 同步
      validations:
          required: true
