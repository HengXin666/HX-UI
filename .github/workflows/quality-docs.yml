name: quality-docs
on:
    # Branch pushes only: a tag push (v2.0.1 ...) is a release, built by release.yml from a commit that was
    # already checked on its branch. For an annotated tag the event "after" is the tag object, not a commit,
    # so ci.ts cannot match the checkout and fails with "Checkout does not match the event head".
    push:
        branches: ["**"]
    pull_request:
permissions:
    contents: read
jobs:
    docs:
        if: github.event.deleted != true
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
                  persist-credentials: false
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
            - name: Run docs checks and collect every finding
              run: node .agents/skills/hx-agent-code/scripts/ci.ts docs
            - name: Upload reports even when checks fail
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: quality-docs-${{ github.run_id }}-${{ github.run_attempt }}
                  path: scripts/.hx_code_quality/reports/
                  include-hidden-files: true
                  if-no-files-found: warn
