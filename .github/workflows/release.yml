name: release

# 打 tag 时构建库并把 tarball 挂到 GitHub Release: 使用者无需 npm 账号.
# 安装: pnpm add https://github.com/HengXin666/HX-UI/releases/download/<tag>/hx-ui-<版本>.tgz
on:
    push:
        tags: ["v*"]
    workflow_dispatch:

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - name: install
              run: npm ci
            - name: tag 与 package.json 版本必须一致
              run: |
                  version=$(node -p "require('./package.json').version")
                  tag="${GITHUB_REF_NAME#v}"
                  if [ "$tag" != "$version" ]; then
                      echo "tag v$tag 与 package.json 的 $version 不一致, 先改版本再打 tag" >&2
                      exit 1
                  fi
            - name: build library
              run: npm run build:lib
            - name: pack
              id: pack
              run: |
                  npm pack --json --ignore-scripts > pack.json
                  node -e "const [p]=require('./pack.json'); console.log('file='+p.filename)" >> "$GITHUB_OUTPUT"
            - name: 产物自检
              run: node scripts/verify-pack.ts
            - name: publish release asset
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TGZ: ${{ steps.pack.outputs.file }}
              run: |
                  tag="$GITHUB_REF_NAME"
                  gh release create "$tag" "$TGZ" --title "$tag" --notes "HX-UI $tag" || gh release upload "$tag" "$TGZ" --clobber
                  echo "install: pnpm add https://github.com/HengXin666/HX-UI/releases/download/$tag/$TGZ"
