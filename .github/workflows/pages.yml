# 文档站: main 分支有推送 (或手动触发) 时, 构建 next/ 的 2.0 文档站并部署到 GitHub Pages.
# 旧的 docs/ (0.18) 不再部署.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只部署一个, 不取消正在进行的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 构建只读仓库, 不拿任何写权限
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: next
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false # 构建阶段不需要 git 凭据

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: next/package-lock.json

      - name: 安装依赖
        run: npm ci

      # vite.config.ts: base "./" + hash 路由, 放在 Pages 子路径下也能用; 产物在 next/dist-site
      - name: 构建文档站
        run: npx vite build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: next/dist-site

  # 部署单独一个 job, 只有它拿 pages / id-token 权限, 而且只在 main 上跑
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
