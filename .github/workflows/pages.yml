name: pages
# 构建文档站 (docs/) 并发布到 GitHub Pages.
# 首次使用前在仓库 Settings > Pages > Build and deployment > Source 选 GitHub Actions.
# 产物用相对路径 (vite base "./") 加 hash 路由, 放在 /<仓库名>/ 子路径下无需额外配置.
on:
    push:
        branches: [main]
    workflow_dispatch:
permissions:
    contents: read
    pages: write
    id-token: write
concurrency:
    group: pages
    cancel-in-progress: false
jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      docs/package-lock.json
            # 文档站直接引用 ../src 的源码, 库的依赖要先装在根目录
            - name: Install library dependencies
              run: npm ci
            - name: Install docs dependencies
              run: npm --prefix docs ci
            # 兄弟目录 HX-Blueprint-Demo 在 CI 里不存在, vite.config.ts 会自动退到 docs/src/blueprint-demo-fallback
            - name: Build docs
              run: npm --prefix docs run build
            - uses: actions/configure-pages@v5
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: docs/dist
    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
