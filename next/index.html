<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HX-UI 2 · 组件</title>
    <meta name="description" content="HX-UI 2: React + Tailwind v4 + shadcn/ui + Motion 的组件库。" />
    <meta name="theme-color" content="#fafaf7" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Crect width='20' height='20' rx='5' fill='%23201d1a'/%3E%3Cpath d='M5.5 6.5h9M10 6.5v8' stroke='%23fff' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E" />
    <!-- 首屏防闪烁: 与 src/hooks/use-theme.tsx 的 themeScript 保持一致 -->
    <script>(()=>{try{var s=JSON.parse(localStorage.getItem("hx-theme")||"{}");var m=s.mode||"system";var d=m==="dark"||(m==="system"&&matchMedia("(prefers-color-scheme: dark)").matches);var e=document.documentElement;e.classList.toggle("dark",d);e.dataset.theme=s.accent||"indigo";}catch(_){}})()</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/site/src/main.tsx"></script>
  </body>
</html>
