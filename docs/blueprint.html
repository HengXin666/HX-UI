<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>蓝图 · 独立画布</title>
    <!--
      防主题闪烁 (FOUC)。

      必须在 React 挂载**之前**同步执行  放到 main.tsx 里就晚了: 页面已经以
      :root 的默认色绘制了一帧, 选了亮色的用户会看到整屏闪一下。
      这里不等任何模块加载, 也不依赖 React。

      ⚠️ 存储键必须与 ThemeToggle.tsx 的 STORAGE_KEY 一致 (hx-ui-docs-theme)。
    -->
    <script>
      (function () {
        try {
          /**
           * 蓝图页默认**暗色**, 与系统偏好无关。
           *
           * 为什么: UE5 的蓝图编辑器是暗色工具, 引脚配色 (青绿 int /
           * 亮绿 float / 品红 string …) 是**为暗底设计**的高饱和色。
           * 系统偏好亮色时若跟着走白底, 这些颜色要么刺眼、要么为了对比度
           * 被压暗到认不出是哪个类型  观感就是"差一点"。
           *
           * 用户仍然可以在页面里切亮色, 那时走亮色令牌那一套。
           */
          var m = localStorage.getItem("hx-ui-docs-theme") || "dark";
          document.documentElement.setAttribute("data-mode", m);
        } catch (e) {
          document.documentElement.setAttribute("data-mode", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/blueprint-main.tsx"></script>
  </body>
</html>
