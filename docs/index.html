<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HX UI · 组件文档</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="alternate icon" href="./favicon.svg" />
    <!--
      地址栏 / 系统栏颜色跟随实际明暗: 两档颜色只写在这个 meta 的 data-* 上,
      下面的内联脚本与 ThemeToggle.applyMode 都从这里读, 不各写一份。
    -->
    <meta name="theme-color" content="#0d1117" data-dark="#0d1117" data-light="#ffffff" />
    <!--
      防主题闪烁 (FOUC)。

      必须在 React 挂载**之前**同步执行  放到 main.tsx 里就晚了: 页面已经以
      :root 的默认色绘制了一帧, 选了亮色的用户会看到整屏闪一下。
      这里不等任何模块加载, 也不依赖 React。

      ⚠️ 存储键必须与 ThemeToggle.tsx 的 STORAGE_KEY 一致 (hx-ui-docs-theme)。
    -->
    <script>
      (function () {
        var m = "dark";
        try {
          m = localStorage.getItem("hx-ui-docs-theme") || "system";
          if (m === "system") {
            m = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          document.documentElement.setAttribute("data-mode", m);
        } catch (e) {
          m = "dark";
          document.documentElement.setAttribute("data-mode", m);
        }
        var tc = document.querySelector('meta[name="theme-color"]');
        if (tc) tc.setAttribute("content", tc.getAttribute("data-" + m) || tc.content);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
